<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <title>Stats – Compteur</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
          integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4"
          crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --border: #334155;
      --text: #f8fafc; --muted: #94a3b8; --accent: #3b82f6;
      --ok: #22c55e; --warn: #f59e0b; --danger: #ef4444;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0;
        --text: #0f172a; --muted: #64748b; --accent: #2563eb;
        --ok: #16a34a; --warn: #d97706; --danger: #dc2626;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100dvh; padding: 16px;
      max-width: 700px; margin: 0 auto;
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 20px; }
    h2 {
      font-size: 11px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.07em;
      font-weight: 600; margin-bottom: 12px;
    }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    input[type="password"], select {
      width: 100%; padding: 11px 14px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 16px; margin-bottom: 8px;
      outline: none; appearance: auto;
    }
    input:focus, select:focus { border-color: var(--accent); }
    button {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      background: var(--accent); color: #fff; font-size: 15px;
      font-weight: 700; cursor: pointer;
    }
    .toast { padding: 9px 14px; border-radius: 8px; font-size: 13px; text-align: center; margin-top: 8px; display: none; }
    .toast.err { background: rgba(239,68,68,0.15); color: var(--danger); }
    /* Stat tiles */
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
    @media (min-width: 420px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 10px; text-align: center; }
    .stat-val { font-size: 34px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
    .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
    /* Live dot */
    .live-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ok); margin-bottom: 10px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 5px var(--ok); animation: blink 1.5s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .chart-wrap { position: relative; height: 240px; }
    /* Group table */
    .grp-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .grp-table td { padding: 8px 4px; }
    .grp-table tr + tr td { border-top: 1px solid var(--border); }
    .grp-table .g-name { font-weight: 700; }
    .grp-table .g-val  { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 52px; }
    .grp-table tfoot td { border-top: 2px solid var(--border); font-weight: 800; padding-top: 9px; }
    /* Operator table */
    .op-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .op-row:last-child { border-bottom: none; }
    .op-name { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .op-grp  { font-size: 12px; color: var(--muted); }
    .op-in   { color: var(--ok);     font-weight: 700; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
    .op-out  { color: var(--danger); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
    .op-net  { color: var(--muted);  font-size: 12px;  min-width: 52px; text-align: right; }
    /* Views */
    #login-view {}
    #stats-view { display: none; }
    .back { font-size: 13px; color: var(--muted); margin-bottom: 16px; display: block; text-decoration: none; }
    .back:hover { color: var(--text); }
    /* Logo */
    .logo-bar { margin-bottom: 14px; }
    .app-logo { height: 28px; width: auto; display: block; }
    #logo-light { display: none; }
    @media (prefers-color-scheme: light) { #logo-dark { display: none; } #logo-light { display: block; } }
    /* Boutons de plage temporelle (évolution) */
    .range-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .range-btns button {
      width: auto; flex: 1 1 auto; min-width: 52px; padding: 6px 4px; font-size: 12px; font-weight: 600;
      background: var(--bg); color: var(--muted); border: 1px solid var(--border);
    }
    .range-btns button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  </style>
</head>
<body>

<div class="logo-bar">
  <img id="logo-dark"  class="app-logo" src="/logo_white.png" alt="" aria-hidden="true">
  <img id="logo-light" class="app-logo" src="/logo.png"       alt="" aria-hidden="true">
</div>

<!-- ── Login ── -->
<div id="login-view">
  <h1>Statistiques</h1>
  <div class="card">
    <h2>Connexion admin</h2>
    <input type="password" id="code" placeholder="Code admin" autocomplete="current-password">
    <button onclick="loadStats()">Accéder</button>
    <div class="toast" id="err"></div>
  </div>
</div>

<!-- ── Stats ── -->
<div id="stats-view">
  <a id="back-link" href="/admin.html" class="back">← Admin</a>
  <h1>Statistiques en direct</h1>

  <!-- Event selector (masqué si un seul événement) -->
  <div class="card" id="event-card" style="display:none">
    <h2>Événement</h2>
    <select id="event-sel" onchange="switchEvent(this.value)" style="margin-bottom:0"></select>
  </div>

  <div class="live-badge"><div class="live-dot"></div> LIVE</div>

  <div class="stat-grid">
    <div class="stat-tile"><div class="stat-val" id="s-count" style="color:var(--accent)">–</div><div class="stat-lbl">Présents</div></div>
    <div class="stat-tile"><div class="stat-val" id="s-peak"  style="color:var(--warn)">–</div><div class="stat-lbl">Pic</div></div>
    <div class="stat-tile"><div class="stat-val" id="s-in"    style="color:var(--ok)">–</div><div class="stat-lbl">Entrées</div></div>
    <div class="stat-tile"><div class="stat-val" id="s-cap"   style="color:var(--muted)">–</div><div class="stat-lbl">Capacité</div></div>
  </div>

  <!-- History chart -->
  <div class="card">
    <h2>Évolution du total</h2>
    <div class="range-btns" id="range-btns">
      <button onclick="setRange(2,this)">2 h</button>
      <button onclick="setRange(6,this)">6 h</button>
      <button class="active" onclick="setRange(24,this)">24 h</button>
      <button onclick="setRange(48,this)">48 h</button>
      <button onclick="setRange(168,this)">7 j</button>
      <button onclick="setRange(720,this)">30 j</button>
      <button onclick="setRange(0,this)">Début</button>
    </div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>

  <!-- Group breakdown -->
  <div class="card" id="grp-card" style="display:none">
    <h2>Par groupe</h2>
    <table class="grp-table">
      <tbody id="grp-body"></tbody>
      <tfoot id="grp-foot"></tfoot>
    </table>
  </div>

  <!-- Per-operator -->
  <div class="card" id="op-card" style="display:none">
    <h2>Par opérateur</h2>
    <div id="op-list"></div>
  </div>
</div>

<script>
'use strict';
let adminCode = '';
let chart = null;
let peak = 0;
let totalIn = 0;
let capacity = 100;
let currentEvent = '';
let statsWs = null;
let events = [];
let wsReconnectDelay = 1000;
let wsTimer = null;
const GROUP_COLORS = ['#f59e0b','#22c55e','#a855f7','#f97316','#06b6d4','#ec4899'];
let groupDatasets = {}; // groupId → dataset index
let cumulIdx = null;    // index du dataset « Entrées cumulées »
let showCumul = false;  // mémorisé : le graphe est reconstruit à chaque fenêtre/refresh 60s
let fullHistory = [];       // historique fin 60s (48h) — vues 2h/6h/24h/48h
let fullHistoryCoarse = []; // historique grossier 5min (60j, total seul) — vues 7j/30j/début
let lastTotal = 0;      // total live (WS)
let lastGroups = [];    // groupes live (WS)
let chartWindowH = 24;  // fenêtre affichée en heures ; 0 = depuis le début

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fetchT(url, opts, ms = 6000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(t));
}

// ── Login ──

async function loadStats() {
  const code = document.getElementById('code').value.trim();
  if (!code) return;

  // Vérifie le code admin via /api/events
  const res = await fetchT(`/api/events?code=${encodeURIComponent(code)}`);
  if (!res.ok) {
    const el = document.getElementById('err');
    el.textContent = 'Code incorrect';
    el.className = 'toast err';
    el.style.display = 'block';
    return;
  }

  adminCode = code;
  const data = await res.json();
  events = data.events || [];

  document.getElementById('login-view').style.display = 'none';
  document.getElementById('stats-view').style.display = 'block';

  // Pré-sélection via ?e=<id> dans l'URL
  const urlE = new URLSearchParams(location.search).get('e');
  currentEvent = events.find(e => e.id === urlE) ? urlE : (events[0]?.id || '');

  if (events.length > 1) {
    const sel = document.getElementById('event-sel');
    sel.innerHTML = events.map(e =>
      `<option value="${esc(e.id)}" ${e.id === currentEvent ? 'selected' : ''}>${esc(e.name)}</option>`
    ).join('');
    document.getElementById('event-card').style.display = '';
  }

  if (currentEvent) await loadEventStats(currentEvent);
}

document.getElementById('code').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadStats();
});

// ── Switch event ──

async function switchEvent(id) {
  wsReconnectDelay = 1000; // T2: reset backoff on event switch
  currentEvent = id;
  if (statsWs) { statsWs.close(); statsWs = null; }
  if (chart) { chart.destroy(); chart = null; }
  peak = 0; totalIn = 0; groupDatasets = {};
  fullHistory = []; fullHistoryCoarse = []; lastTotal = 0; lastGroups = [];
  document.getElementById('s-peak').textContent = '–';
  document.getElementById('s-in').textContent   = '–';
  document.getElementById('s-count').textContent = '–';
  // Update back link for admin
  document.getElementById('back-link').href = `/admin.html`;
  await loadEventStats(id);
}

// ── Load stats for an event ──

async function loadEventStats(eventId) {
  const data = await fetchT(`/api/history?code=${adminCode}&e=${eventId}`).then(r => r.json());

  capacity = data.capacity;
  totalIn  = data.totalIn ?? 0;
  peak     = data.history.length ? Math.max(...data.history.map(h => h.c), data.total) : data.total;

  document.getElementById('s-cap').textContent  = capacity;
  document.getElementById('s-in').textContent   = totalIn;
  document.getElementById('s-peak').textContent = peak;
  updateCount(data.total);

  fullHistory       = data.history || [];
  fullHistoryCoarse = data.historyCoarse || [];
  lastTotal   = data.total;
  lastGroups  = data.groups || [];
  renderChart();

  renderGroups(data.groups || []);
  renderOpStats(data.groups || []);

  connectWS(eventId);
}

// ── Display ──

function updateCount(total) {
  document.getElementById('s-count').textContent = total;
  if (total > peak) {
    peak = total;
    document.getElementById('s-peak').textContent = peak;
  }
}

function renderGroups(groups) {
  const card = document.getElementById('grp-card');
  if (groups.length <= 1) { card.style.display = 'none'; return; }
  card.style.display = '';

  const totalCount = groups.reduce((s, g) => s + g.count, 0);
  const totalInAll = groups.reduce((s, g) => s + g.totalIn, 0);
  const totalOutAll = groups.reduce((s, g) => s + g.totalOut, 0);

  document.getElementById('grp-body').innerHTML = groups.map(g =>
    `<tr>
      <td class="g-name">${esc(g.name)}</td>
      <td class="g-val" style="color:var(--accent)">${g.count}</td>
      <td class="g-val" style="color:var(--ok)">+${g.totalIn}</td>
      <td class="g-val" style="color:var(--danger)">−${g.totalOut}</td>
    </tr>`
  ).join('');

  document.getElementById('grp-foot').innerHTML =
    `<tr>
      <td class="g-name">Total</td>
      <td class="g-val" style="color:var(--accent)">${totalCount}</td>
      <td class="g-val" style="color:var(--ok)">+${totalInAll}</td>
      <td class="g-val" style="color:var(--danger)">−${totalOutAll}</td>
    </tr>`;
}

function renderOpStats(groups) {
  // Combine opStats across all groups
  const combined = {};
  const opGroup = {}; // name → group name (last seen)
  for (const g of groups) {
    for (const [name, s] of Object.entries(g.opStats || {})) {
      if (!combined[name]) combined[name] = { in: 0, out: 0 };
      combined[name].in  += s.in;
      combined[name].out += s.out;
      opGroup[name] = g.name;
    }
  }
  const entries = Object.entries(combined)
    .filter(([, s]) => s.in > 0 || s.out > 0)
    .sort((a, b) => b[1].in - a[1].in);

  const card = document.getElementById('op-card');
  if (entries.length === 0) { card.style.display = 'none'; return; }
  card.style.display = '';

  document.getElementById('op-list').innerHTML = entries.map(([name, s]) =>
    `<div class="op-row">
      <span class="op-name">${esc(name)}<span class="op-grp"> · ${esc(opGroup[name] || '')}</span></span>
      <span class="op-in">+${s.in}</span>
      <span class="op-out">−${s.out}</span>
      <span class="op-net">${s.in - s.out} net</span>
    </div>`
  ).join('');
}

// ── Chart ──

function isLight() { return window.matchMedia('(prefers-color-scheme: light)').matches; }
function chartPalette() {
  return isLight()
    ? { tick:'#64748b', gridX:'#f1f5f9', gridY:'#e2e8f0', tooltipBg:'#ffffff', tooltipBorder:'#e2e8f0', tooltipTitle:'#0f172a', tooltipBody:'#64748b', legend:'#64748b' }
    : { tick:'#64748b', gridX:'#1e293b', gridY:'#334155', tooltipBg:'#1e293b', tooltipBorder:'#334155', tooltipTitle:'#f8fafc', tooltipBody:'#94a3b8', legend:'#94a3b8' };
}

function fmt(ts) {
  const d = new Date(ts);
  // 48h (à cheval sur 2 jours) → date + heure ; vues longues → date ; ≤24h → heure.
  if (chartWindowH > 24 && chartWindowH <= 48) {
    return d.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  }
  return (chartWindowH === 0 || chartWindowH > 48)
    ? d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' })
    : d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

// Axe X = temps réel (échelle linéaire sur timestamps) → les points sont placés à leur
// vraie position temporelle : un pas de 30 min se voit comme 30 min, pas comme une case.
function buildChart(history, currentTotal, cap, groups) {
  const now  = Date.now();
  const xMin = history.length ? history[0].t : now;
  const p = chartPalette();
  groupDatasets = {};

  const datasets = [
    { label:'Présents',
      data:[...history.map(h => ({ x: h.t, y: h.c })), { x: now, y: currentTotal }],
      borderColor:'#3b82f6', backgroundColor:'rgba(59,130,246,0.08)', fill:true, tension:0.3, pointRadius:0, pointHoverRadius:4, borderWidth:2.5 },
    { label:'Capacité',
      data:[{ x: xMin, y: cap }, { x: now, y: cap }],
      borderColor:'rgba(239,68,68,0.55)', borderDash:[6,4], borderWidth:1.5, pointRadius:0, fill:false },
  ];

  // Entrées cumulées — axe droit (sans rapport d'échelle avec l'occupation), masqué par
  // défaut : clic sur la légende pour l'afficher. `i` absent (points d'avant la feature)
  // → null + spanGaps, la ligne démarre là où les cumuls ont commencé à être enregistrés.
  cumulIdx = datasets.length;
  datasets.push({
    label:'Entrées cumulées', yAxisID:'y1', hidden: !showCumul,
    data:[...history.map(h => ({ x: h.t, y: h.i ?? null })), { x: now, y: totalIn }],
    borderColor:'#0d9488', backgroundColor:'transparent', fill:false, tension:0.3,
    pointRadius:0, pointHoverRadius:4, borderWidth:2, borderDash:[2,3], spanGaps:true,
  });

  if (groups.length > 1) {
    groups.forEach((g, i) => {
      const color = GROUP_COLORS[i % GROUP_COLORS.length];
      datasets.push({
        label: g.name,
        // Vraie évolution enregistrée (h.g[gid]) + point courant. null avant le début
        // de l'enregistrement par groupe → la ligne démarre quand les données existent.
        data: [...history.map(h => ({ x: h.t, y: h.g?.[g.id] ?? null })), { x: now, y: g.count }],
        borderColor: color,
        backgroundColor: 'transparent',
        fill: false, tension: 0.3, pointRadius: 0, pointHoverRadius: 4,
        borderWidth: 1.5, borderDash: [4, 2], spanGaps: true,
      });
      groupDatasets[g.id] = datasets.length - 1;
    });
  }

  chart = new Chart(document.getElementById('chart').getContext('2d'), {
    type: 'line',
    data: { datasets },
    options: {
      responsive:true, maintainAspectRatio:false, animation:false,
      interaction:{ mode:'nearest', axis:'x', intersect:false },
      plugins:{
        legend:{ labels:{ color:p.legend, boxWidth:12, font:{size:12} },
          onClick(e, item, legend) {
            Chart.defaults.plugins.legend.onClick.call(this, e, item, legend);
            // Mémorise le choix : renderChart() détruit/reconstruit le graphe toutes les 60s.
            if (item.datasetIndex === cumulIdx) showCumul = legend.chart.isDatasetVisible(cumulIdx);
          } },
        tooltip:{ backgroundColor:p.tooltipBg, borderColor:p.tooltipBorder, borderWidth:1, titleColor:p.tooltipTitle, bodyColor:p.tooltipBody,
          callbacks:{ title: items => items.length ? new Date(items[0].parsed.x).toLocaleString('fr-FR',{ day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '' } },
      },
      scales:{
        x:{ type:'linear', bounds:'data',
            ticks:{ color:p.tick, maxTicksLimit:7, font:{size:11}, callback: v => fmt(v) },
            grid:{ color:p.gridX } },
        y:{ beginAtZero:true, ticks:{ color:p.tick, font:{size:11} }, grid:{ color:p.gridY } },
        // display:'auto' → l'axe droit n'apparaît que si les entrées cumulées sont affichées.
        y1:{ type:'linear', position:'right', display:'auto', beginAtZero:true,
             ticks:{ color:p.tick, font:{size:11} }, grid:{ drawOnChartArea:false } },
      },
    },
  });

  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
    if (!chart) return;
    const np = chartPalette();
    chart.options.plugins.legend.labels.color = np.legend;
    chart.options.plugins.tooltip.backgroundColor = np.tooltipBg;
    chart.options.plugins.tooltip.borderColor = np.tooltipBorder;
    chart.options.plugins.tooltip.titleColor = np.tooltipTitle;
    chart.options.plugins.tooltip.bodyColor = np.tooltipBody;
    chart.options.scales.x.ticks.color = np.tick;
    chart.options.scales.x.grid.color  = np.gridX;
    chart.options.scales.y.ticks.color = np.tick;
    chart.options.scales.y.grid.color  = np.gridY;
    chart.options.scales.y1.ticks.color = np.tick;
    chart.update('none');
  });
}

// Choisit la série + filtre selon la fenêtre. ≤48h (rétention fine) → fine (avec groupes) ;
// au-delà / début → grossière 5min (total seul, pas de lignes par groupe).
function selectedSeries() {
  const fine = chartWindowH > 0 && chartWindowH <= 48;
  const src  = fine ? fullHistory : fullHistoryCoarse;
  const points = chartWindowH
    ? src.filter(h => h.t >= Date.now() - chartWindowH * 3600_000)
    : src;
  return { points, withGroups: fine };
}

// (Re)construit le graphe à partir de la série filtrée + point « maintenant ».
function renderChart() {
  if (chart) { chart.destroy(); chart = null; }
  const { points, withGroups } = selectedSeries();
  buildChart(points, lastTotal, capacity, withGroups ? lastGroups : []);
}

// Mise à jour live : on déplace le DERNIER point (« maintenant ») au lieu d'empiler
// un point par clic → axe temporel cohérent (les points historiques restent les
// échantillons 60s du serveur, rafraîchis périodiquement).
function updateLivePoint() {
  if (!chart) return;
  const now = Date.now();
  const ds = chart.data.datasets;
  const setLast = (arr, pt) => { if (arr.length) arr[arr.length - 1] = pt; };
  setLast(ds[0].data, { x: now, y: lastTotal });
  if (cumulIdx !== null && ds[cumulIdx]) setLast(ds[cumulIdx].data, { x: now, y: totalIn });
  // Capacité : ligne 2 points [début des données, maintenant]
  const d0 = ds[0].data;
  ds[1].data = [{ x: d0.length ? d0[0].x : now, y: capacity }, { x: now, y: capacity }];
  if (lastGroups && lastGroups.length > 1) {
    lastGroups.forEach(g => {
      const idx = groupDatasets[g.id];
      if (idx !== undefined) setLast(ds[idx].data, { x: now, y: g.count });
    });
  }
  chart.update('none');
}

// Changement de fenêtre temporelle (boutons 2h / 6h / 24h / 48h / 7j / 30j / Début)
function setRange(h, btn) {
  chartWindowH = h;
  document.querySelectorAll('#range-btns button').forEach(b => b.classList.toggle('active', b === btn));
  renderChart();
}

// ── WebSocket (admin connection — no group) ──

function wsReconnectNow() {
  if (wsTimer) { clearTimeout(wsTimer); wsTimer = null; }
  if (statsWs) {
    const old = statsWs; statsWs = null;
    old.onopen = old.onmessage = old.onerror = old.onclose = null;
    try { old.close(); } catch {}
  }
  wsReconnectDelay = 1000;
  if (currentEvent) connectWS(currentEvent);
}

function connectWS(eventId) {
  if (statsWs && statsWs.readyState <= 1) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const myWs = new WebSocket(`${proto}//${location.host}?e=${encodeURIComponent(eventId)}`);
  statsWs = myWs;
  let lastMsg = Date.now();
  let pingTimer = null;

  myWs.onopen = () => {
    wsReconnectDelay = 1000;
    pingTimer = setInterval(() => {
      if (myWs !== statsWs || myWs.readyState !== 1) return;
      if (Date.now() - lastMsg > 60_000) { myWs.close(); return; }
      myWs.send(JSON.stringify({ type: 'ping' }));
    }, 20_000);
  };

  myWs.onmessage = ({ data }) => {
    lastMsg = Date.now();
    if (statsWs !== myWs) return;
    const msg = JSON.parse(data);
    if (msg.type === 'pong') return;
    if (msg.type === 'init') {
      updateCount(msg.total);
      fetchT(`/api/history?code=${adminCode}&e=${currentEvent}`)
        .then(r => r.json())
        .then(d => {
          if (currentEvent !== eventId) return;
          totalIn = d.totalIn ?? totalIn;
          document.getElementById('s-in').textContent = totalIn;
          fullHistory = d.history || fullHistory;
          fullHistoryCoarse = d.historyCoarse || fullHistoryCoarse;
          lastTotal = msg.total;
          renderChart();
        })
        .catch(() => {});
      return;
    }
    if (msg.type === 'update') {
      updateCount(msg.total);
      totalIn += (msg.delta > 0 ? msg.delta : 0);
      document.getElementById('s-in').textContent = totalIn;
      lastTotal = msg.total;
      if (msg.groups) lastGroups = msg.groups;
      updateLivePoint();
      if (msg.groups) {
        const tbody = document.getElementById('grp-body');
        if (tbody.children.length > 0) {
          msg.groups.forEach((g, i) => {
            const row = tbody.children[i];
            if (row) row.children[1].textContent = g.count;
          });
          const foot = document.getElementById('grp-foot');
          if (foot.children[0]) foot.children[0].children[1].textContent = msg.total;
        }
      }
      if (msg.capacity !== undefined) {
        capacity = msg.capacity;
        document.getElementById('s-cap').textContent = capacity;
        updateLivePoint(); // recompose la ligne capacité (échelle linéaire) avec la nouvelle valeur
      }
    }
  };

  myWs.onclose = () => {
    clearInterval(pingTimer);
    if (statsWs !== myWs) return;
    statsWs = null;
    if (!document.hidden) {
      const d = wsReconnectDelay;
      wsReconnectDelay = Math.min(wsReconnectDelay * 2, 30000);
      wsTimer = setTimeout(() => { if (currentEvent === eventId) connectWS(eventId); }, d);
    }
  };
  myWs.onerror = () => myWs.close();
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && currentEvent) wsReconnectNow();
});

// Rafraîchit l'historique 30s du serveur toutes les 60s → la fenêtre glisse et
// récupère les nouveaux échantillons (le live entre deux échantillons vient du WS).
setInterval(() => {
  if (!currentEvent || document.hidden) return;
  fetchT(`/api/history?code=${adminCode}&e=${currentEvent}`)
    .then(r => r.json())
    .then(d => {
      fullHistory = d.history || fullHistory;
      fullHistoryCoarse = d.historyCoarse || fullHistoryCoarse;
      // Resync du cumul : le +delta optimiste du WS peut dériver (bornage au 0 du total).
      totalIn = d.totalIn ?? totalIn;
      document.getElementById('s-in').textContent = totalIn;
      if (!statsWs || statsWs.readyState !== 1) lastTotal = d.total; // pas de WS → total du fetch
      renderChart();
    })
    .catch(() => {});
}, 60_000);
</script>
