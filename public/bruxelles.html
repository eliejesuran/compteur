<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hôtel de Ville — Bruxelles</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }

    .sky {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 60%, #1b2a4a 0%, #0d1117 70%);
      z-index: 0;
    }

    .stars {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .stars::before, .stars::after {
      content: '';
      position: absolute;
      width: 2px; height: 2px;
      background: white;
      border-radius: 50%;
      box-shadow:
        12vw 8vh 0 0 rgba(255,255,255,.7),
        28vw 5vh 0 0 rgba(255,255,255,.5),
        45vw 12vh 0 0 rgba(255,255,255,.8),
        62vw 7vh 0 0 rgba(255,255,255,.4),
        78vw 14vh 0 0 rgba(255,255,255,.6),
        88vw 4vh 0 0 rgba(255,255,255,.7),
        5vw 22vh 0 0 rgba(255,255,255,.3),
        35vw 18vh 0 0 rgba(255,255,255,.5),
        55vw 25vh 0 0 rgba(255,255,255,.4),
        72vw 20vh 0 0 rgba(255,255,255,.6),
        93vw 9vh 0 0 rgba(255,255,255,.5),
        18vw 30vh 0 0 rgba(255,255,255,.3),
        48vw 3vh 0 0 rgba(255,255,255,.9),
        83vw 28vh 0 0 rgba(255,255,255,.4);
    }
    .stars::after {
      width: 1px; height: 1px;
      box-shadow:
        7vw 15vh 0 0 rgba(255,255,255,.5),
        22vw 10vh 0 0 rgba(255,255,255,.4),
        38vw 22vh 0 0 rgba(255,255,255,.6),
        58vw 16vh 0 0 rgba(255,255,255,.3),
        74vw 11vh 0 0 rgba(255,255,255,.5),
        90vw 18vh 0 0 rgba(255,255,255,.4),
        15vw 35vh 0 0 rgba(255,255,255,.3),
        52vw 32vh 0 0 rgba(255,255,255,.4);
    }

    .moon {
      position: fixed;
      top: 6vh;
      right: 12vw;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 38%, #fffde0, #e8d080);
      box-shadow: 0 0 30px 8px rgba(232,208,128,.25);
      z-index: 2;
    }

    .ground {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      height: 18vh;
      background: linear-gradient(to top, rgba(20,30,10,.7) 0%, transparent 100%);
      z-index: 2;
    }

    pre#art {
      position: relative;
      z-index: 3;
      color: #b8a060;
      /* s'adapte à la largeur : ~120 colonnes × char_width = viewport */
      font-size: min(calc(99vw / 120), calc(96vh / 70));
      line-height: 1.18;
      white-space: pre;
      text-align: left;
      text-shadow: 0 0 10px rgba(200,160,60,.35);
      letter-spacing: 0;
      user-select: none;
      filter: drop-shadow(0 2px 18px rgba(180,140,50,.18));
    }

    .label {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      color: rgba(184,160,96,.5);
      font-size: clamp(8px, 1vw, 12px);
      letter-spacing: .25em;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
      white-space: nowrap;
    }
  </style>
</head>

  <div class="sky"></div>
  <div class="stars"></div>
  <div class="moon"></div>
  <div class="ground"></div>

  <div class="label">Hôtel de Ville &mdash; Bruxelles</div>
